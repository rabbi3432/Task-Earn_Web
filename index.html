<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TakaEarn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;font-family:'Hind Siliguri',sans-serif;background:#f4faf6;color:#173b28}.wrap{max-width:520px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #0001}.brand{text-align:center;padding:20px}.brand h1{color:#159447}.input{width:100%;padding:13px;margin:7px 0;border:1px solid #d9e4dd;border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:12px 16px;background:#159447;color:white;font:inherit;font-weight:700}.gold{background:#e7a900}.tabs,.row,.nav{display:flex;gap:8px}.tabs button,.nav button{flex:1}.row{justify-content:space-between;align-items:center}.hidden{display:none}.amount{font-size:34px;font-weight:700}.task{border:1px solid #e4eee7;padding:14px;border-radius:14px;margin:9px 0}.muted{color:#718278}</style></head><body><div class="wrap"><section id="auth" class="card"><div class="brand"><div>🪙</div><h1>TakaEarn</h1><p>অনলাইনে আয় করুন সহজে</p></div><div class="tabs"><button class="btn" onclick="mode(1)">লগইন</button><button class="btn gold" onclick="mode(0)">রেজিস্টার</button></div><div id="loginPanel"><input id="lp" class="input" placeholder="মোবাইল নাম্বার"><input id="lpass" class="input" type="password" placeholder="পাসওয়ার্ড"><button class="btn" id="loginBtn">লগইন করুন</button></div><div id="reg" class="hidden"><input id="rn" class="input" placeholder="আপনার নাম"><input id="rp" class="input" placeholder="মোবাইল নাম্বার"><input id="rpass" class="input" type="password" placeholder="পাসওয়ার্ড"><input id="rr" class="input" placeholder="রেফার কোড (ঐচ্ছিক)"><button class="btn" id="registerBtn">রেজিস্টার করুন</button></div><p id="msg" class="muted"></p></section><section id="app" class="hidden"><div class="row card"><div><b id="name">User</b><div class="muted" id="phone"></div></div><button class="btn" onclick="logout()">লগআউট</button></div><div class="card"><div class="muted">মোট ব্যালেন্স</div><div class="amount">৳ <span id="bal">0.00</span></div><div class="row"><button class="btn" onclick="checkin()">ডেইলি +৳15</button><button class="btn gold" onclick="spin()">স্পিন</button></div></div><div id="home" class="card"><div class="row"><h2>সক্রিয় টাস্ক</h2><button class="btn" onclick="load()">রিফ্রেশ</button></div><div id="tasks"></div></div><div id="wallet" class="card hidden"><h2>উইথড্র</h2><input id="wa" class="input" type="number" placeholder="পরিমাণ"><select id="wm" class="input"><option value="bkash">bKash</option><option value="nagad">Nagad</option><option value="rocket">Rocket</option><option value="bank">Bank</option></select><input id="wn" class="input" placeholder="একাউন্ট নাম্বার"><button class="btn" onclick="withdraw()">রিকোয়েস্ট পাঠান</button></div><div id="ref" class="card hidden"><h2>রেফার</h2><p>আপনার কোড: <b id="code">—</b></p><button class="btn" onclick="navigator.clipboard.writeText(code.textContent)">কপি</button><p id="refs"></p></div><div id="noti" class="card hidden"><h2>নোটিফিকেশন</h2><div id="notes"></div></div><div class="nav"><button class="btn" onclick="page('home')">হোম</button><button class="btn" onclick="page('wallet')">ওয়ালেট</button><button class="btn" onclick="page('ref')">রেফার</button><button class="btn" onclick="page('noti')">নোটিফাই</button></div></section></div><script>
const SUPABASE_URL='https://gzamivqrrflogjjvhbej.supabase.co';
const SUPABASE_KEY='sb_publishable_emPACnJ0LsZ1GjParqjJVA_wDO3faQg';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null;
const q=id=>document.getElementById(id);
const emailForPhone=p=>'phone_'+String(p).replace(/\D/g,'')+'@taskearn.local';
function mode(isLogin){q('loginPanel').classList.toggle('hidden',!isLogin);q('reg').classList.toggle('hidden',isLogin);say('')}
function say(x){q('msg').textContent=x||''}
function busy(btn,on){if(btn){btn.disabled=on;btn.dataset.old=btn.dataset.old||btn.textContent;btn.textContent=on?'কাজ হচ্ছে...':btn.dataset.old}}
async function doLogin(btn){
 busy(btn,true);
 try{
  const p=q('lp').value.trim(),pw=q('lpass').value;
  if(!p||!pw){say('মোবাইল নাম্বার ও পাসওয়ার্ড দিন');return}
  say('লগইন হচ্ছে...');
  const {data,error}=await db.auth.signInWithPassword({email:emailForPhone(p),password:pw});
  if(error){say('লগইন ব্যর্থ: '+error.message);return}
  if(!data?.session){say('সেশন তৈরি হয়নি। আবার চেষ্টা করুন।');return}
  user=data.user;await enter();
 }catch(e){console.error(e);say('লগইনে সমস্যা: '+(e?.message||e))}
 finally{busy(btn,false)}
}
async function doRegister(btn){
 busy(btn,true);
 try{
  const n=q('rn').value.trim(),p=q('rp').value.trim(),pw=q('rpass').value;
  if(!n||!p||pw.length<6){say('নাম, নাম্বার ও ৬+ অক্ষরের পাসওয়ার্ড দিন');return}
  say('অ্যাকাউন্ট তৈরি হচ্ছে...');
  const {data,error}=await db.auth.signUp({email:emailForPhone(p),password:pw,options:{data:{phone:p,full_name:n,referral_code_input:q('rr').value.trim()}}});
  if(error){say('রেজিস্ট্রেশন ব্যর্থ: '+error.message);return}
  if(!data?.user){say('অ্যাকাউন্ট তৈরি হয়নি। আবার চেষ্টা করুন।');return}
  if(!data.session){say('অ্যাকাউন্ট তৈরি হয়েছে কিন্তু সেশন পাওয়া যায়নি। Email confirmation OFF আছে কি না যাচাই করুন।');return}
  user=data.user;await enter();
 }catch(e){console.error(e);say('রেজিস্ট্রেশনে সমস্যা: '+(e?.message||e))}
 finally{busy(btn,false)}
}
async function enter(){
 const {data,error}=await db.auth.getUser();
 if(error||!data?.user){say(error?.message||'ইউজার সেশন পাওয়া যায়নি');return}
 user=data.user;q('auth').classList.add('hidden');q('app').classList.remove('hidden');await load();
}
async function load(){
 if(!user)return;
 const [p,t,r,n]=await Promise.all([
  db.from('profiles').select('*').eq('id',user.id).maybeSingle(),
  db.from('tasks').select('*').eq('is_active',true).order('created_at',{ascending:false}),
  db.from('referrals').select('*').eq('referrer_id',user.id),
  db.from('user_notifications').select('*').or('user_id.eq.'+user.id+',user_id.is.null').order('created_at',{ascending:false}).limit(20)
 ]);
 if(p.error)say('প্রোফাইল লোড হয়নি: '+p.error.message);
 const x=p.data;q('name').textContent=x?.full_name||'User';q('phone').textContent=x?.phone||'';q('bal').textContent=Number(x?.money_balance||0).toFixed(2);q('code').textContent=x?.referral_code||'—';q('refs').textContent='মোট রেফার: '+(r.data||[]).length;
 q('tasks').innerHTML=(t.data||[]).map(v=>'<div class="task"><div class="row"><b>'+v.title+'</b><b>৳'+Number(v.reward||0).toFixed(2)+'</b></div><p class="muted">'+(v.description||'')+'</p><button class="btn" onclick="submitTask('+v.id+')">সাবমিট</button></div>').join('')||'<p>কোনো সক্রিয় টাস্ক নেই</p>';
 q('notes').innerHTML=(n.data||[]).map(v=>'<div class="task"><b>'+v.title+'</b><div>'+v.body+'</div></div>').join('')||'কোনো নোটিফিকেশন নেই';
}
async function submitTask(id){const p=prompt('Proof/প্রমাণ লিখুন');if(!p)return;const r=await db.rpc('submit_task',{p_task_id:id,p_proof:p});alert(r.error?r.error.message:'সাবমিট হয়েছে; অনুমোদনের পর রিওয়ার্ড যোগ হবে');load()}
async function checkin(){const r=await db.rpc('claim_daily_checkin');alert(r.error?r.error.message:'ডেইলি চেক-ইন সফল: +৳'+Number(r.data||0).toFixed(2));load()}
async function spin(){const r=await db.rpc('claim_spin');alert(r.error?r.error.message:'স্পিন রিওয়ার্ড: ৳'+Number(r.data?.reward||0).toFixed(2));load()}
async function withdraw(){const r=await db.rpc('request_withdrawal',{p_amount:Number(q('wa').value),p_method:q('wm').value,p_account_number:q('wn').value.trim()});alert(r.error?r.error.message:'উইথড্র রিকোয়েস্ট পাঠানো হয়েছে');load()}
function page(x){['home','wallet','ref','noti'].forEach(k=>q(k).classList.toggle('hidden',k!==x))}
async function logout(){await db.auth.signOut();location.reload()}
Object.assign(window,{mode,submitTask,checkin,spin,withdraw,page,logout});
window.addEventListener('error',e=>{console.error(e.error||e.message);if(q('msg'))say('অ্যাপের ত্রুটি: '+e.message)});
document.addEventListener('DOMContentLoaded',async()=>{
 q('loginBtn').addEventListener('click',()=>doLogin(q('loginBtn')));
 q('registerBtn').addEventListener('click',()=>doRegister(q('registerBtn')));
 const {data}=await db.auth.getSession();if(data?.session){user=data.session.user;await enter()}
});
</script></body></html>
