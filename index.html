<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TakaEarn</title><script>
document.addEventListener('DOMContentLoaded',function(){
 const b=document.getElementById('submitProofBtn');
 if(b){b.addEventListener('click',function(e){
  e.preventDefault();
  if(typeof window.submitCurrentTask==='function'){window.submitCurrentTask();}
  else{const m=document.getElementById('msg');if(m)m.textContent='Submit system load হয়নি। পেজটি Refresh করুন।';}
 });}
});
</script></body></html>
