name: Build Task Earn APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build User and Admin APKs
        run: gradle assembleUserRelease assembleAdminRelease
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/user/release/app-user-release.apk task-earn-user-v1.0.1.apk
          cp app/build/outputs/apk/admin/release/app-admin-release.apk task-earn-admin-v1.0.1.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: task-earn-apks-v1.0.1
          path: |
            task-earn-user-v1.0.1.apk
            task-earn-admin-v1.0.1.apk
