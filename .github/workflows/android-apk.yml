name: Build Task Earn APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build User and Admin APKs
        run: gradle assembleUserRelease assembleAdminRelease
      - name: Locate and rename APKs
        run: |
          find app/build/outputs -type f -name "*.apk" -print
          USER_APK=$(find app/build/outputs -type f -name "*.apk" | grep -E 'user|User' | head -n 1)
          ADMIN_APK=$(find app/build/outputs -type f -name "*.apk" | grep -E 'admin|Admin' | head -n 1)
          test -n "$USER_APK"
          test -n "$ADMIN_APK"
          cp "$USER_APK" task-earn-user-v1.0.1.apk
          cp "$ADMIN_APK" task-earn-admin-v1.0.1.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: task-earn-apks-v1.0.1
          path: |
            task-earn-user-v1.0.1.apk
            task-earn-admin-v1.0.1.apk
